name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        run: pytest
      - name: Package
        run: |
          mkdir -p dist
          zip -r dist/research-assistant.zip research_assistant templates \
            requirements.txt requirements-dev.txt README.md AGENTS.md \
            -x '*__pycache__*'
      - uses: actions/upload-artifact@v4
        with:
          name: research-assistant
          path: dist/*.zip
          if-no-files-found: error
